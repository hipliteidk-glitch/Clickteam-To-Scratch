name: Convert FNAF4
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/convert.yml
      - cts2/**
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: free disk + swap 32GB
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - name: deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow lz4 psutil
      - name: download exe from release
        run: |
          gh release download fnaf4-bin --pattern "fnaf4.exe" --repo hipliteidk-glitch/Clickteam-To-Scratch --clobber
          ls -lh fnaf4.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: apply OOM patches
        run: python3 patch_oom.py
      - name: convert low-mem
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u cts2_cli.py fnaf4.exe -o fnaf4.sb3 --no-audio --fast-frames --progress json 2>&1 | tee log.txt
          ls -lh fnaf4.sb3 || true
          tail -n 300 log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fnaf4-sb3
          path: fnaf4.sb3
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: convert-logs
          path: log.txt
