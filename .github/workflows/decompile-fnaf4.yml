name: decompile fnaf4
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: add swap 16GB
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: download exe
        run: |
          gh release download fnaf4-exe -p "fnaf4.exe" -O /tmp/fnaf4.exe --repo hipliteidk-glitch/Clickteam-To-Scratch || gh release download -p "*.exe" -O /tmp/fnaf4.exe --repo hipliteidk-glitch/Clickteam-To-Scratch
          ls -lh /tmp/fnaf4.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: decompile (low-mem fast frames)
        env:
          CTS2_FAST_FRAMES: "1"
          CTS2_SKIP_AUDIO: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u -X tracemalloc cts2_cli.py /tmp/fnaf4.exe -o fnaf4.sb3 --progress json --no-audio --fast-frames 2>&1 | tee log.txt || python3 -u cts2_cli.py /tmp/fnaf4.exe -o fnaf4.sb3 2>&1 | tee log.txt
          ls -lh fnaf4.sb3 || true
          du -sh fnaf4.sb3 || true
      - uses: actions/upload-artifact@v4
        with: { name: fnaf4-sb3, path: fnaf4.sb3, if-no-files-found: warn }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: logs, path: log.txt }
