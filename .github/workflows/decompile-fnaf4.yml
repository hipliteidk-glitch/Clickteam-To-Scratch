name: decompile fnaf4
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: download exe from release
        run: |
          gh release download -p "fnaf4.exe" -O /tmp/fnaf4.exe || \
          curl -L -o /tmp/fnaf4.exe ${{ secrets.FNAF4_URL }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 cts2_cli.py /tmp/fnaf4.exe -o fnaf4.sb3
      - uses: actions/upload-artifact@v4
        with: { name: fnaf4-sb3, path: fnaf4.sb3 }
