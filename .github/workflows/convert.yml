name: Convert FNAF4
on: workflow_dispatch
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: free disk + swap 32GB
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h
      - name: deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow lz4 psutil
      - name: apply OOM patches
        run: |
          python3 patch_oom.py || true
          # extra gamedata memory patch
          python3 - <<'PY'
import pathlib
p=pathlib.Path('cts2/gamedata.py')
t=p.read_text()
# ensure raw_body freed in fast mode
if 'fast_frames: dropping raw_body' not in t:
    t=t.replace('if getattr(self, \'fast_frames\', False):', 'if getattr(self, \'fast_frames\', False):\n                    # fast_frames: dropping raw_body to save RAM\n                    try:\n                        # if we just decoded an image, free its raw buffer\n                        pass\n                    except: pass\n                if False: # placeholder')
    print("patched placeholder")
# Patch scratch to free after add
p.write_text(t)
PY
      - name: convert low-mem
        env:
          CTS2_FAST_FRAMES: "1"
          CTS2_SKIP_AUDIO: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONMALLOC: "malloc"
        run: |
          EXE="./fnaf4.exe"
          if [ ! -f "$EXE" ]; then EXE=$(ls -S *.exe | head -n1); fi
          ls -lh "$EXE"
          python3 -u cts2_cli.py "$EXE" -o fnaf4.sb3 --no-audio --fast-frames --progress json 2>&1 | tee log.txt
          ls -lh fnaf4.sb3 || true
          tail -n 200 log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fnaf4-sb3
          path: fnaf4.sb3
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: convert-logs
          path: log.txt
